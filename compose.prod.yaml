# Серверная надстройка: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    logging: *logging
  backend:
    logging: *logging
  bot:
    logging: *logging
  web:
    ports: !override
      - "${WEB_HTTP_PORT:-80}:8080"
      - "${WEB_HTTPS_PORT:-443}:8443"
      - "${WEB_HTTPS_PORT:-443}:8443/udp"
    logging: *logging
