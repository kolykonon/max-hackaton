name: kaplya

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  init: true
  env_file: .env
  volumes:
    - ./certs:/certs:ro
  networks: [default, database]

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-kaplya}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    <<: *backend
    image: ${COMPOSE_PROJECT_NAME:-kaplya}-backend:local
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *backend
    image: ${COMPOSE_PROJECT_NAME:-kaplya}-bot:local
    command: ["python", "-m", "app.bot.worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/bot-heartbeat').st_mtime < 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        VITE_DEV_USER_ID: ${VITE_DEV_USER_ID-1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8088}:8080"
    environment:
      DOMAIN: ${DOMAIN:-:8080}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    profiles: [tunnel]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "--url", "http://web:8080"]
    depends_on:
      web:
        condition: service_healthy

networks:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
